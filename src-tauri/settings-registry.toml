section = "Notifications"
title = "Notify on agent finish after"
summary = "An agent turn that finishes faster than this stays quiet. Failures and requests always notify."
doc = """
An agent turn that finished faster than this many milliseconds stays quiet;
failures and requests for you are never held back. 0 turns it off. Must be
between 0 and 3600000.
"""
validation = "0 ≤ n ≤ 3600000"

