# The settings registry — the one hand-edited source for every key under
# `[settings]` in `~/.config/atlas/config.toml`.
#
# GENERATED FROM THIS FILE (never edit those by hand; run `bun run settings:gen`):
#
#   src-tauri/src/state/settings_docs.gen.rs        the comment Atlas writes above
#                                                   each key in a fresh config.toml
#   src/features/settings/lib/settings-registry.gen.ts
#                                                   the TS `AppSettings` type, its
#                                                   defaults, and per-key metadata
#                                                   (page, section, title) for the
#                                                   Settings UI and its search
#   docs/reference/settings.json                    the same metadata, for the docs
#                                                   site (`docs-atlas`, `bun run
#                                                   sync:settings` there)
#   docs/reference/configuration.md                 the generated schema table only
#
# `bun run settings:gen:check` (and `bun run test`) fail when any of them is
# stale. What this file can NOT generate is the Rust `AppSettings` struct, its
# serde defaults and its patch type — those stay hand-written in
# `src-tauri/src/state/atlas_config.rs`, and the Rust test
# `the_settings_registry_matches_app_settings` fails the build the moment this
# file and that struct disagree on a key, its order, or its default. So a new
# setting is: a field there, an entry here, `bun run settings:gen`.
#
# ── An entry ──────────────────────────────────────────────────────────────────
#
#   key         the camelCase name written in config.toml. Entries are in the
#               struct's field order, which is also the generated file's order.
#   type        boolean | integer | number | string | enum | string-list |
#               optional-string | table
#   values      enum only: the accepted strings, in the order the UI offers them.
#   min / max   integer and number only: the inclusive bounds `validate()`
#               enforces.
#   default     the built-in value, as TOML. Absent for optional-string and
#               table, whose default is "the key is not in the file".
#   status      live      shown as a row in Settings (page/section/title below)
#               elsewhere set from somewhere else in the app (`set_in` says where)
#               file-only no UI; edit config.toml by hand
#               internal  Atlas's own bookkeeping; never edit
#               legacy    no longer read except by a migration; safe to delete
#   page        Settings page id (a `[[page]]` id, also a Settings section):
#               general, appearance, icons, chat, memory, notifications, source-control, privacy, updates
#   section     heading inside that page.
#   title       the row's label, sentence case, no trailing period.
#   summary     one sentence for the row's description and for search results.
#   doc         the comment written above the key in a fresh config.toml —
#               plain prose, wrapped and prefixed with `#` by the generator,
#               which also appends `(default: …)`. Says what the key does, what
#               values mean, and anything surprising. Never restates the type.
#   validation  how the docs table describes the accepted values ("—" if any).
#   platforms   optional: the platforms the key has any effect on.
#   applies     optional: when a change takes effect, if not immediately.
#   set_in      `elsewhere` only: where in the app the user changes it.
#   ts_type / ts_import
#               optional: name an existing TS type instead of the generated one.
#   ts_default  optional: the TS default for a key whose Rust default is absent.
#
# ── `[[page]]`: a Settings page ───────────────────────────────────────────────
#
#   id / title / description   in the order the Settings sidebar lists them.

